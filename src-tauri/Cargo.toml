[package]
name = "ref-lombardia"
version = "0.1.2"
description = "Compilazione guidata della Relazione Economico-Finanziaria (REF) - Regione Lombardia"
edition = "2021"

[lib]
name = "ref_lombardia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
